<!DOCTYPE html>
<!-- map.html — the page shell the WebView loads: the pane DIVs, the groove between them, the launch
     cover, and the script tags. All behavior is in js/map.js; this file is the DOM + the CSS.

       #panes  (position:absolute, inset:0)
       ┌───────────────┬─┬───────────────┐
       │   #pane2      │ │   #pane3      │   .pane divs are STATIC — all four always exist, so a map's
       │               │ │               │   container is there before map.js constructs the map. The
       ├───────────────┤ ├───────────────┤   layout only shows/hides and positions them.
       │   #pane0      │ │   #pane1      │
       │  (visible at  │ │               │   #gutterV / #gutterH: ONE vertical + ONE horizontal groove
       │   launch,     │ │               │   covers every layout (1x1, 2x1, 2x2). Panes are positioned
       │   full-bleed) │ │               │   with the gap already subtracted, so a groove is pure
       └───────────────┴─┴───────────────┘   decoration over ground no map occupies.
                        ▲
                    the groove: a dark channel with a hairline on EACH side, not one drawn line —
                    a lone hairline is lost over bright returns, a lone dark gap disappears between
                    two dark panes; the pair reads over both

       #mapcover — an opaque dark lid (z-index 5) over everything until the launch CONUS mask lands,
                   then faded out. Without it the world basemap paints for ~½s first: the flash.

     ⚠️ A pane's CHROME is NOT here — each pane's notch (product selector + colour ramp + tilt) is a XAML
     control overlaid on the WebView (Controls/Primitives/OverlayBar in its island form, filled with
     Composites/PaneNotchContent) so it stays editable under Hot Reload and can use the app's theme
     brushes. The old ghosted PaneWatermark this comment used to name is DELETED — the notch names the
     product a few pixels away, lit, with its ramp attached. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline map</title>

    <link href="vendor/maplibre-gl.css" rel="stylesheet" />

    <!-- The chrome palette, and the ONE home for every color the page draws that isn't data. A
         render-blocking stylesheet, linked FIRST, so --anvil-ground is resolved before the body
         paints (no flash) and the CSS radar-sites.js injects at runtime can use the variables too.
         ⚠️ The rules below own LAYOUT; theme.css owns COLOR. Keep a literal color out of here. -->
    <link href="theme.css" rel="stylesheet" />

    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: var(--anvil-ground);
            overflow: hidden;
        }

        /* ===== PANE GRID =====
           The page hosts ONE MapLibre map per pane (map.js owns them). The pane divs are STATIC so a
           map's container always exists before the map is constructed; map.js positions and shows the
           ones the current layout uses and hides the rest. Layouts: 1x1, 2x1 (side by side), 2x2.
           Two-pane is side-by-side only — there is deliberately no stacked variant. */
        #panes {
            position: absolute;
            inset: 0;
        }

        .pane {
            position: absolute;
            background: var(--anvil-ground);
            display: none; /* map.js shows the panes the layout uses */
        }

        /* Single-pane is the launch layout, so pane 0 starts full-bleed and visible — the map paints
           without waiting for a layout round-trip. */
        #pane0 {
            inset: 0;
            display: block;
        }

        /* ===== THE GROOVE =====
           Panes are separated by a dark channel with a hairline on EACH side, not a single drawn line.
           Two reasons it is a groove: a lone hairline gets lost over bright radar returns, and a lone
           dark gap disappears between two dark panes — the pair reads over both. The hairline is the
           app's CardStrokeColorDefaultSolidBrush, the same edge the OverlayBar draws; a ThemeResource
           can't reach in here, so theme.css carries the value (--anvil-groove-edge).
           ⚠️ It used to be a literal, justified as "the map band is always dark regardless of app
           theme" — which stopped being true the moment the basemap became the theme's choice.
           Non-interactive: the panes are positioned with the gap already subtracted, so these divs are
           pure decoration over ground no map occupies. */
        .gutter {
            position: absolute;
            background: var(--anvil-ground);
            pointer-events: none;
            box-sizing: border-box;
            display: none; /* map.js shows the ones the layout needs */
        }

        .gutter.v {
            border-left: 1px solid var(--anvil-groove-edge);
            border-right: 1px solid var(--anvil-groove-edge);
        }

        .gutter.h {
            border-top: 1px solid var(--anvil-groove-edge);
            border-bottom: 1px solid var(--anvil-groove-edge);
        }

        /* NB: a pane's NOTCH (product selector + colour ramp + tilt) is not styled here — it is a XAML
           control overlaid on the WebView (see the header comment), so it can be edited under XAML Hot
           Reload and picks up the app's theme brushes. */

        /* Opaque dark cover over the map until the launch mask (CONUS) is applied. Without it the world
           basemap (Canada/Mexico/oceans) paints on first 'load' and shows for ~½s before the mask lands
           via the host round-trip — the flash. map.js fades this out once the initial mask is on screen
           (or immediately when no isolation is requested). Consistent with the dark, no-flash launch. */
        #mapcover {
            position: absolute;
            inset: 0;
            background: var(--anvil-ground);
            z-index: 5;
            transition: opacity 0.25s ease-out;
        }

        #mapcover.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="panes">
        <div class="pane" id="pane0"></div>
        <div class="pane" id="pane1"></div>
        <div class="pane" id="pane2"></div>
        <div class="pane" id="pane3"></div>
        <!-- One vertical + one horizontal groove covers every supported layout (1x1, 2x1, 2x2). -->
        <div class="gutter v" id="gutterV"></div>
        <div class="gutter h" id="gutterH"></div>
    </div>
    <div id="mapcover"></div>

    <!-- ⚠️ THE PAGE'S DEATH REPORT, AND IT MUST STAY THE FIRST SCRIPT ON THE PAGE. Nothing in here caught
         an uncaught error before this existed: a throw outside a try/catch (or a rejected promise nobody
         awaits) killed whatever was mid-flight and left NO trace on the C# side, which is a black or
         half-drawn map with a healthy-looking log. Registering these handlers ahead of the other tags is
         what lets them also report a LOAD or PARSE failure in maplibre / radar.js / map.js — after those
         tags it would be too late for exactly the failures that blank the whole page.
         Its sibling is MainWindow.OnWebViewProcessFailed, which covers the case this cannot: the render
         process dying, when no JS runs at all. Both land in the radar diagnostics stream, so the moment the
         JS events stop there is a line saying why. -->
    <script>
        (function () {
            function report(kind, msg, src, line, col, stack) {
                try {
                    if (!window.chrome || !window.chrome.webview) return; // plain browser / dev harness
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'pageError', kind: kind, msg: String(msg || ''),
                        src: String(src || ''), line: line || 0, col: col || 0,
                        stack: String(stack || '').slice(0, 2000)   // capped: a deep stack must not blow the message
                    }));
                } catch (e) { /* a reporter that throws is worse than no reporter */ }
            }
            window.addEventListener('error', function (e) {
                // Two shapes arrive here: a real exception (has .error) and a resource/script LOAD failure
                // (no .error, target is the element that failed) — the latter is how a missing or broken
                // vendored bundle shows up, so keep both.
                if (e && e.error) report('exception', e.message, e.filename, e.lineno, e.colno, e.error.stack);
                else if (e && e.target && e.target.src) report('load', 'failed to load ' + e.target.src, e.target.src, 0, 0, '');
                else if (e) report('exception', e.message, e.filename, e.lineno, e.colno, '');
            }, true); // CAPTURE: resource load errors do not bubble
            window.addEventListener('unhandledrejection', function (e) {
                var r = e ? e.reason : null;
                report('rejection', (r && r.message) ? r.message : r, '', 0, 0, r && r.stack);
            });
        })();
    </script>

    <script src="vendor/maplibre-gl.js"></script>
    <script src="vendor/pmtiles.js"></script>
    <script src="js/radar.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
