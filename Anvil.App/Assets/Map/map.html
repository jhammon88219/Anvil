<!DOCTYPE html>
<!-- map.html — the page shell the WebView loads: the pane DIVs, the groove between them, the launch
     cover, every UI component's <template>, and the script tags. All behavior is in js/; every look is
     in styles/ (linked below).

       #panes  (position:absolute, inset:0)
       ┌───────────────┬─┬───────────────┐
       │   #pane2      │ │   #pane3      │   .pane divs are STATIC — all four always exist, so a map's
       │               │ │               │   container is there before map.js constructs the map. The
       ├───────────────┤ ├───────────────┤   layout only shows/hides and positions them.
       │   #pane0      │ │   #pane1      │
       │  (visible at  │ │               │   #gutterV / #gutterH: ONE vertical + ONE horizontal groove
       │   launch,     │ │               │   covers every layout (1x1, 2x1, 2x2). Panes are positioned
       │   full-bleed) │ │               │   with the gap already subtracted, so a groove is pure
       └───────────────┴─┴───────────────┘   decoration over ground no map occupies.
                        ▲
                    the groove: a dark channel with a hairline on EACH side, not one drawn line —
                    a lone hairline is lost over bright returns, a lone dark gap disappears between
                    two dark panes; the pair reads over both

       #mapcover — an opaque dark lid (z-index 5) over everything until the launch CONUS mask lands,
                   then faded out. Without it the world basemap paints for ~½s first: the flash.

     ⚠️ A pane's CHROME is NOT here — each pane's notch (product selector + colour ramp + tilt) is a XAML
     control overlaid on the WebView (Controls/Primitives/OverlayBar in its island form, filled with
     Composites/PaneNotchContent) so it stays editable under Hot Reload and can use the app's theme
     brushes. The old ghosted PaneWatermark this comment used to name is DELETED — the notch names the
     product a few pixels away, lit, with its ramp attached. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline map</title>

    <link href="vendor/maplibre-gl.css" rel="stylesheet" />

    <!-- THE STYLES — every sheet is in styles/ (see Assets/Map/README.md, "Where the UI is defined").
         ORDER MATTERS, and every one is a render-blocking <link> so the first paint is already right:
           themes/      the palettes, VARIABLES ONLY. anvil-dark.css is the base :root (so --anvil-ground
                        resolves before the body paints — no flash); each further theme overrides it.
           pages/       this page's own shell (panes, groove, launch cover): layout, colours via var().
           components/  one sheet per on-map component; each pairs with a <template> below. After
                        maplibre-gl.css on purpose: .user-loc etc. must outrank .maplibregl-marker.
         ⚠️ Keep a literal chrome colour out of pages/ and components/ — it belongs in a theme file. -->
    <link href="styles/themes/anvil-dark.css" rel="stylesheet" />
    <link href="styles/themes/anvil-light.css" rel="stylesheet" />
    <link href="styles/pages/map.css" rel="stylesheet" />
    <link href="styles/components/radar-site-keys.css" rel="stylesheet" />
    <link href="styles/components/markers.css" rel="stylesheet" />
    <link href="styles/components/radar-tools.css" rel="stylesheet" />
    <link href="styles/components/map-popups.css" rel="stylesheet" />
    <link href="styles/components/outlook.css" rel="stylesheet" />
</head>
<body>
    <div id="panes">
        <div class="pane" id="pane0"></div>
        <div class="pane" id="pane1"></div>
        <div class="pane" id="pane2"></div>
        <div class="pane" id="pane3"></div>
        <!-- One vertical + one horizontal groove covers every supported layout (1x1, 2x1, 2x2). -->
        <div class="gutter v" id="gutterV"></div>
        <div class="gutter h" id="gutterH"></div>
    </div>
    <div id="mapcover"></div>

    <!-- ══ UI COMPONENTS ═════════════════════════════════════════════════════════════════════════
         Every component the page draws is DEFINED HERE, before runtime: its markup is a <template>
         below and its look is a sheet in styles/components/. A module only clones a template
         (js/templates.js), fills in text / data / per-instance geometry, and toggles classes — it never
         builds markup in a string, sets a static look inline, or injects a <style>.
         ⚠️ An id here is named by a module (grep the id). A template a module asks for and this page
         lacks THROWS, by name, into the pageError report — rename both or neither.
         ⚠️ preview.html carries COPIES of the templates its modules use (tpl-ring-knob) — change both. -->

    <!-- ── RADAR SITE KEY (radar-sites.js · components/radar-site-keys.css) ──
         marker (MapLibre positions it) > offset (the fan's translate target) > the key's three zones.
         The glyph zone is filled from one of the three tpl-glyph-* templates by network. -->
    <template id="tpl-site-key">
        <div class="radar-site-marker">
            <div class="radar-site-offset">
                <div class="radar-site-btn">
                    <span class="radar-site-glyph"></span>
                    <span class="radar-site-label"></span>
                    <span class="radar-site-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></span>
                </div>
            </div>
        </div>
    </template>
    <!-- The network glyphs; fill/stroke are currentColor = the key's status ink. The nexrad viewBox is
         CROPPED to its drawing (which sits in the lower-left of a 24 box) so it centres in the square
         and reads the same size as the plane and flask. -->
    <template id="tpl-glyph-nexrad"><svg viewBox="2.5 3.5 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="17" r="1.4" fill="currentColor" stroke="none"/><path d="M7 12.5a4.5 4.5 0 0 1 4.5 4.5"/><path d="M7 7.5a9.5 9.5 0 0 1 9.5 9.5"/></svg></template>
    <template id="tpl-glyph-tdwr"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.6 0 1 .9 1 2v5.2l7 4v1.9l-7 -2v3.9l2 1.5v1.5l-3 -1l-3 1v-1.5l2 -1.5v-3.9l-7 2v-1.9l7 -4v-5.2c0 -1.1 .4 -2 1 -2z"/></svg></template>
    <template id="tpl-glyph-research"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v5l-4.4 8.3a1.9 1.9 0 0 0 1.7 2.7h9.4a1.9 1.9 0 0 0 1.7 -2.7l-4.4 -8.3v-5"/></svg></template>
    <!-- The collision fan's overlay (one per map) and the two parts of one leader: a ring at the true
         site + a dashed line to the moved key. JS sets the coordinates only. -->
    <template id="tpl-site-lines"><svg class="radar-site-lines" id="radar-site-lines" aria-hidden="true"></svg></template>
    <template id="tpl-site-leader"><svg><circle class="radar-site-leader-origin" r="3"/><line class="radar-site-leader-line"/></svg></template>

    <!-- ── USER LOCATION RETICLE (markers.js · components/markers.css) ──
         Ring r=9 and ticks spanning radius 11 → 14.5 (a deliberate gap, so the ticks read as standing OFF
         the ring rather than piercing it). Casing first at a fat stroke, the ink over it. -->
    <template id="tpl-user-loc">
        <div class="user-loc">
            <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
                <g class="user-loc-casing"><circle cx="18" cy="18" r="9"/><path d="M18,7 V3.5 M18,29 V32.5 M7,18 H3.5 M29,18 H32.5"/></g>
                <g class="user-loc-ink"><circle cx="18" cy="18" r="9"/><path d="M18,7 V3.5 M18,29 V32.5 M7,18 H3.5 M29,18 H32.5"/></g>
                <circle class="user-loc-collar" cx="18" cy="18" r="4.5"/>
                <circle class="user-loc-core" cx="18" cy="18" r="3"/>
            </svg>
        </div>
    </template>
    <!-- ── SEARCH PIN (markers.js · components/markers.css) — a teardrop, tip on the coordinate. -->
    <template id="tpl-place-pin">
        <div class="place-pin">
            <div class="place-pin-art">
                <svg width="28" height="38" viewBox="0 0 28 38" aria-hidden="true">
                    <path class="place-pin-body" d="M14,36 C14,36 3,22.5 3,13.5 A11,11 0 1 1 25,13.5 C25,22.5 14,36 14,36 Z"/>
                    <circle class="place-pin-eye" cx="14" cy="13.5" r="4"/>
                </svg>
            </div>
            <div class="place-pin-label"></div>
        </div>
    </template>

    <!-- ── RADAR TOOLS (radar-ruler.js · radar-scope.js · radar-inspect.js · site-reveal.js ·
         components/radar-tools.css) ──
         The KNOB is shared: the ruler's knob and the range rings' distance-label handle are one control
         (JS adds .radar-ruler-handle or .radar-ring-handle and sets the svg's size from Knob size).
         ⚠️ preview.html carries a copy of tpl-ring-knob — change both. -->
    <template id="tpl-ring-knob">
        <div>
            <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="ring-knob-disc" cx="12" cy="12" r="7.5"/>
                <circle class="ring-knob-dot" cx="12" cy="12" r="2.5"/>
            </svg>
        </div>
    </template>
    <template id="tpl-ruler-bead">
        <div class="radar-ruler-handle">
            <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
                <circle class="ruler-bead-casing" cx="13" cy="13" r="8"/>
                <circle class="ruler-bead-ink" cx="13" cy="13" r="8"/>
                <circle class="ruler-bead-core" cx="13" cy="13" r="4"/>
            </svg>
        </div>
    </template>
    <!-- The ruler's chip: the reading, how far to the ring, then up to two faint lines. JS fills each
         line's text and hides the ones with nothing to say. -->
    <template id="tpl-ruler-chip">
        <div class="radar-ruler-chip" id="radar-ruler-chip">
            <div class="radar-ruler-chip-main"></div>
            <div class="radar-ruler-chip-sub"></div>
            <div class="radar-ruler-chip-faint"></div>
            <div class="radar-ruler-chip-note"></div>
        </div>
    </template>
    <!-- Inspect's value box (one per pane) and its mirrored crosshair. -->
    <template id="tpl-inspect-tip">
        <div class="radar-inspect-tip">
            <div class="radar-inspect-main"></div>
            <div class="radar-inspect-raw" hidden></div>
        </div>
    </template>
    <template id="tpl-inspect-cross">
        <div class="radar-inspect-cross">
            <div class="radar-inspect-cross-bar h"></div>
            <div class="radar-inspect-cross-bar v"></div>
        </div>
    </template>
    <template id="tpl-reveal-ring"><div class="site-reveal-ring"></div></template>

    <!-- ── MAP POPUPS (storm-reports.js · damage-surveys.js · storm-cells.js · tropical.js ·
         components/map-popups.css) ──
         Each is a popup's CONTENT; MapLibre supplies the surface (className map-popup). JS sets every
         line as TEXT (feed data is never HTML) and hides the lines it has nothing for. -->
    <template id="tpl-report-popup">
        <div>
            <div class="map-popup-title"></div>
            <div class="map-popup-meta"></div>
            <div class="map-popup-body"></div>
        </div>
    </template>
    <template id="tpl-survey-popup">
        <div>
            <div class="map-popup-title"><span class="map-popup-chip"></span><span class="map-popup-title-text"></span></div>
            <div class="map-popup-meta"></div>
            <div class="map-popup-body"></div>
            <div class="map-popup-src"></div>
        </div>
    </template>
    <template id="tpl-cell-popup">
        <div>
            <div class="map-popup-title"><span class="map-popup-chip"></span><span class="map-popup-title-text"></span></div>
            <div class="map-popup-meta"></div>
            <div class="map-popup-src"></div>
        </div>
    </template>
    <template id="tpl-tropical-popup">
        <div>
            <div class="tropical-band"></div>
            <div class="tropical-storm"></div>
            <div class="tropical-more-list"></div>
            <div class="map-popup-meta"></div>
        </div>
    </template>
    <template id="tpl-tropical-more"><div class="tropical-more"><span class="map-popup-chip"></span><span class="tropical-more-name"></span></div></template>

    <!-- ── OUTLOOK NOTE (outlook.js · components/outlook.css) — SPC's own "no risk areas" words. -->
    <template id="tpl-outlook-note"><div class="outlook-note"></div></template>

    <!-- ── BOOT ERROR (map.js · pages/map.css) — shown only when the boot itself throws. -->
    <template id="tpl-boot-error"><div class="boot-error"></div></template>

    <!-- ⚠️ THE PAGE'S DEATH REPORT, AND IT MUST STAY THE FIRST SCRIPT ON THE PAGE. Nothing in here caught
         an uncaught error before this existed: a throw outside a try/catch (or a rejected promise nobody
         awaits) killed whatever was mid-flight and left NO trace on the C# side, which is a black or
         half-drawn map with a healthy-looking log. Registering these handlers ahead of the other tags is
         what lets them also report a LOAD or PARSE failure in maplibre / radar.js / map.js — after those
         tags it would be too late for exactly the failures that blank the whole page.
         Its sibling is MainWindow.OnWebViewProcessFailed, which covers the case this cannot: the render
         process dying, when no JS runs at all. Both land in the radar diagnostics stream, so the moment the
         JS events stop there is a line saying why. -->
    <script>
        (function () {
            function report(kind, msg, src, line, col, stack) {
                try {
                    if (!window.chrome || !window.chrome.webview) return; // plain browser / dev harness
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'pageError', kind: kind, msg: String(msg || ''),
                        src: String(src || ''), line: line || 0, col: col || 0,
                        stack: String(stack || '').slice(0, 2000)   // capped: a deep stack must not blow the message
                    }));
                } catch (e) { /* a reporter that throws is worse than no reporter */ }
            }
            window.addEventListener('error', function (e) {
                // Two shapes arrive here: a real exception (has .error) and a resource/script LOAD failure
                // (no .error, target is the element that failed) — the latter is how a missing or broken
                // vendored bundle shows up, so keep both.
                if (e && e.error) report('exception', e.message, e.filename, e.lineno, e.colno, e.error.stack);
                else if (e && e.target && e.target.src) report('load', 'failed to load ' + e.target.src, e.target.src, 0, 0, '');
                else if (e) report('exception', e.message, e.filename, e.lineno, e.colno, '');
            }, true); // CAPTURE: resource load errors do not bubble
            window.addEventListener('unhandledrejection', function (e) {
                var r = e ? e.reason : null;
                report('rejection', (r && r.message) ? r.message : r, '', 0, 0, r && r.stack);
            });
        })();
    </script>

    <script src="vendor/maplibre-gl.js"></script>
    <script src="vendor/pmtiles.js"></script>
    <script src="js/radar.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
