<!DOCTYPE html>
<!-- preview.html — the Settings window's MAP PREVIEW page (hosted by Controls/Composites/MapPreview). ONE map,
     no panes, no radar data, no overlays: the basemap the app wears, and the range rings around one site.

       ┌──────────────────────────────────────────┐
       │            ·  ·  ·  ·  ·                 │   basemap = the main map's style, tile source,
       │        ·    ┌┄┄┄┄┄┄┄┄┄┐    ·    ◉       │   theme and hidden groups (the mirror replays them)
       │      ·    ┆   100 mi    ┆    ·           │
       │     ·    ┆      ╳ KTLX   ┆    ·          │   rings = THE REAL radar-scope.js, at a NEXRAD's
       │      ·    ┆             ┆    ·           │   base-tilt reach (no frame to measure one from)
       │        ·    └┄┄┄┄┄┄┄┄┄┘    ·            │
       │            ·  ·  ·  ·  ·                 │   ◉ the label handle — drag it and the MAIN map's
       └──────────────────────────────────────────┘     labels swing too (the host pushes the bearing)

     ⚠️ No site keys and no "KTLX" text: the site is the rings' centre, nothing else is drawn on purpose — a
     preview that grows its own markers stops being a preview of the settings.
     ⚠️ The theme attribute is set by the inline script BEFORE the body paints (--anvil-ground is the
     page's own background), for the same reason map.html takes `theme` as a URL param.
     All behaviour is in js/preview.js. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map preview</title>
    <link href="vendor/maplibre-gl.css" rel="stylesheet" />
    <link href="theme.css" rel="stylesheet" />
    <script>
        (function () {
            var t = new URLSearchParams(location.search).get('theme');
            if (t) document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: var(--anvil-ground);
            overflow: hidden;
        }
        #map {
            position: absolute;
            inset: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="vendor/pmtiles.js"></script>
    <script type="module" src="js/preview.js"></script>
</body>
</html>
